<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ .Site.BaseURL }}">
      <img class="brand-logo" src="{{ "img/logo.png" | relURL }}" alt="Thinx-Tank logo">
      {{ .Site.Title }}
    </a>
    <nav>
      <a href="{{ "posts/" | relLangURL }}">Posts</a>
      <a href="{{ "tags/" | relLangURL }}">Tags</a>
      {{ with .OutputFormats.Get "RSS" }}<a href="{{ .RelPermalink }}">RSS</a>{{ end }}
    </nav>
  </div>
</header>
