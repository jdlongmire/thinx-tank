{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<div class="search-box">
  <input type="search" id="search-input" placeholder="Search posts..." autocomplete="off" aria-label="Search posts">
</div>
<p id="search-hint" class="meta">Type to search across every post.</p>
<ul id="search-results" class="post-list"></ul>
<script>
(function() {
  var input = document.getElementById("search-input");
  var results = document.getElementById("search-results");
  var hint = document.getElementById("search-hint");
  var pages = [];
  fetch({{ "index.json" | relURL }})
    .then(function(r) { return r.json(); })
    .then(function(data) { pages = data; });
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function render(q) {
    q = q.trim().toLowerCase();
    if (!q) { results.innerHTML = ""; hint.style.display = ""; return; }
    var terms = q.split(/\s+/);
    var hits = pages.filter(function(p) {
      var hay = (p.title + " " + p.description + " " + p.tags + " " + p.content).toLowerCase();
      return terms.every(function(t) { return hay.indexOf(t) !== -1; });
    }).slice(0, 20);
    hint.style.display = "none";
    results.innerHTML = hits.length
      ? hits.map(function(p) {
          return '<li><a href="' + p.url + '">' + esc(p.title) + '</a>' +
                 '<span class="meta">' + p.date + '</span></li>';
        }).join("")
      : "<li>No posts match &ldquo;" + esc(q) + "&rdquo;.</li>";
  }
  input.addEventListener("input", function(e) { render(e.target.value); });
})();
</script>
{{ end }}
