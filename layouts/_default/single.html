{{ define "main" }}
<article class="post">
  <header>
    <h1>{{ .Title }}</h1>
    <p class="meta">
      {{ if eq .Section "posts" }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>{{ end }}
      {{ with .Params.tags }}
      <span class="tags">
        {{ range . }}<a class="tag" href="{{ "tags/" | relLangURL }}{{ . | urlize }}/">{{ . }}</a>{{ end }}
      </span>
      {{ end }}
    </p>
  </header>
  {{ with .Params.hero }}
  {{ if ne $.Params.hero_position "body" }}
  <figure class="hero post-hero">
    <img src="{{ . | relURL }}" alt="{{ $.Params.hero_alt | default $.Title }}">
  </figure>
  {{ end }}
  {{ end }}
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
